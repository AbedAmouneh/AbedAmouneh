<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
<defs>
  <style>
    .f { font-family: "Courier New", Courier, monospace; }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  </style>

  <pattern id="scan" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
    <rect x="0" y="0" width="1200" height="1" fill="rgba(0,0,0,0.28)"/>
  </pattern>

  <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b0"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b2"/>
    <feMerge>
      <feMergeNode in="b0"/>
      <feMergeNode in="b1"/>
      <feMergeNode in="b2"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="cglow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <radialGradient id="vign" cx="50%" cy="50%" r="72%">
    <stop offset="0%" stop-color="transparent"/>
    <stop offset="100%" stop-color="rgba(0,0,2,0.65)"/>
  </radialGradient>
</defs>

<!-- BG -->
<rect width="1200" height="280" fill="#06060f"/>

